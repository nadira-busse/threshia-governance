[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "threshia-governance"
version = "0.1.0"
description = "A rule-first governance engine for AI-agent tool calls."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nadira Busse" }
]
dependencies = [
  "chromadb>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
include = ["threshia*"]

[tool.setuptools.package-data]
# Policy documents are loaded at runtime (see threshia/policies/loader.py),
# not imported as Python — without this, an installed build would be
# missing them even though the package "works".
threshia = ["policies/documents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pyflakes, pycodestyle, import sort, pyupgrade

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
